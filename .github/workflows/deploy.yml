# Build the site and push it to Netlify. Netlify has no GitHub connection; the site
# (kovir-labs) is manual-deploy and this workflow is the only thing that publishes it.
# The daily run refreshes release versions, stars and the idea board without a commit.
# Pull requests run the checks only. Until the Netlify secrets exist, deploy runs build
# everything and skip the publish step with a warning instead of failing.
name: Deploy to Netlify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs the tests, and proves the site builds from the committed snapshot alone, as it must
  # when GitHub is down. This is also the check on pull requests.
  fallback-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run refresh
        env:
          GITHUB_TOKEN: ''
      - run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_NETLIFY: ${{ secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != '' }}
    # Never run two production deploys at once; the newest run wins.
    concurrency:
      group: netlify-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      # Exits 1 if a curated repo no longer exists on GitHub, which stops the deploy.
      - run: npm run refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run catalog
      - run: npm run build
      - if: env.HAS_NETLIFY != 'true'
        run: echo "::warning::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID not set — built the site but did not deploy. See docs/LAUNCH.md."
      # --no-build: the CLI builds by default; we already built above.
      - if: env.HAS_NETLIFY == 'true'
        run: npx --yes netlify-cli@27 deploy --prod --no-build --dir=dist --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
